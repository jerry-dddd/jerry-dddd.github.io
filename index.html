<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e93b3d">
<title>福利小卖部</title>
<style>
:root{
  --primary:#e93b3d;
  --grad:linear-gradient(135deg,#ff6034,#e93b3d);
  --bg:#f5f6f8;
  --card:#ffffff;
  --text:#1f2329;
  --muted:#86909c;
  --line:#e5e6eb;
  --warn:#e6a23c;
  --receipt-bg:#fffbe6;
  --receipt-line:#e6b980;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei","Heiti SC",sans-serif;
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body.lock{overflow:hidden}
button{font-family:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea{font-family:inherit;font-size:14px}
img{display:block}

/* ---------- 顶部 ---------- */
.topbar{background:var(--grad);color:#fff;padding:14px 16px 12px;padding-top:calc(14px + env(safe-area-inset-top))}
.topbar h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.5px}
.topbar .notice{margin-top:6px;font-size:12px;line-height:1.5;background:rgba(255,255,255,.18);border-radius:8px;padding:5px 10px}
.topbar .notice:empty{display:none}

/* ---------- 搜索 + 分类 ---------- */
.filter-bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 12px 2px}
.search-row{display:flex;align-items:center;background:#fff;border-radius:10px;padding:0 10px;height:38px;border:1px solid var(--line)}
.search-row .icon{color:var(--muted);margin-right:6px;font-size:14px}
.search-row input{flex:1;border:0;outline:0;min-width:0;background:transparent}
.search-row .clear{color:var(--muted);font-size:16px;padding:4px 6px;display:none}
.search-row.hasq .clear{display:block}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:8px;padding-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:#fff;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:5px 14px;font-size:13px}
.chip.on{background:#ffece9;border-color:var(--primary);color:var(--primary);font-weight:600}

/* ---------- 商品列表 ---------- */
#goods{padding:4px 12px 90px;display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;background:var(--card);border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(31,35,41,.05)}
.thumb{width:138px;height:138px;flex:none;border-radius:10px;overflow:hidden;background:#f2f3f5;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.noimg{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px dashed #d4d7dc;border-radius:10px;color:#b3b7bf;background:#fafbfc}
.noimg span{font-size:30px}
.noimg i{font-style:normal;font-size:10px}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.name{font-size:15px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.note{margin-top:2px;font-size:12px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.pricerow{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding-top:6px}
.pricebox{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.price{color:var(--primary);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.price .rmb{font-size:12px;font-weight:600;margin-right:1px}
.per{font-size:11px;color:var(--muted)}
.chip-stock{font-size:10px;color:var(--warn);background:#fdf3e3;border-radius:4px;padding:1px 6px}
.chip-stock.out{color:#fff;background:#c9cdd4}
.stepper{display:flex;align-items:center;gap:8px;flex:none}
.st-btn{width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;user-select:none}
.st-btn.inc{background:var(--grad);color:#fff;font-size:16px}
.st-btn.dec{border:1px solid var(--line);color:var(--muted);background:#fff}
.st-btn.dis{opacity:.35}
.st-num{min-width:20px;text-align:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.empty-tip{padding:60px 20px;text-align:center;color:var(--muted)}
.empty-tip .big{font-size:40px;margin-bottom:10px}

/* ---------- 底部购物车栏 ---------- */
#cartBar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;
  background:#2b2f36;color:#fff;border-radius:16px;height:56px;display:flex;align-items:center;padding:0 6px 0 14px;
  box-shadow:0 6px 20px rgba(0,0,0,.25)}
#cartBar[hidden]{display:none}
.cart-ico{position:relative;font-size:22px;line-height:1;margin-right:10px}
.badge{position:absolute;top:-8px;right:-12px;min-width:18px;height:18px;border-radius:9px;background:var(--primary);color:#fff;
  font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-variant-numeric:tabular-nums}
.badge:empty{display:none}
.cart-info{flex:1;min-width:0;display:flex;flex-direction:column}
.cart-cnt{font-size:11px;color:#a9aeb8}
.cart-total{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.cart-total .rmb{font-size:12px}
.btn-primary{background:var(--grad);color:#fff;border-radius:12px;height:44px;padding:0 22px;font-size:15px;font-weight:600}
.btn-primary:active{opacity:.85}

/* ---------- 购物车面板 ---------- */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:stretch;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;height:100%;border-radius:0;display:flex;flex-direction:column;overflow:hidden}
.sheet-head{display:flex;align-items:center;gap:6px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-head b{font-size:16px}
.sheet-head .cnt{color:var(--muted);font-size:12px}
.sheet-head .x{margin-left:auto;font-size:18px;color:var(--muted);padding:4px 8px}
.sheet-body{overflow-y:auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet-actions{display:flex;justify-content:center;padding-top:4px}
.btn-ghost{border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 20px;font-size:13px;background:#fff}

/* 订单汇总卡（截屏区） */
#receiptWrap:empty{display:none}
.receipt{background:var(--receipt-bg);border:1.5px dashed var(--receipt-line);border-radius:12px;padding:12px 12px 10px;margin-bottom:14px}
.receipt .r-title{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed var(--receipt-line);padding-bottom:8px;margin-bottom:8px}
.receipt .r-title b{font-size:15px}
.receipt .r-title time{font-size:11px;color:var(--muted)}
.r-line{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.r-line img,.r-line .r-noimg{width:34px;height:34px;border-radius:6px;object-fit:cover;flex:none}
.r-line .r-noimg{background:#f2f3f5;display:flex;align-items:center;justify-content:center;font-size:14px}
.r-line .r-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-line .r-amt{font-variant-numeric:tabular-nums;font-weight:600;flex:none;min-width:56px;text-align:right}
.r-line .stepper{gap:6px}
.r-line .st-btn{width:26px;height:26px;font-size:15px}
.r-line .st-num{min-width:18px;font-size:14px}
.r-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--receipt-line);margin-top:8px;padding-top:8px}
.r-total .t{font-size:13px;color:var(--text)}
.r-total .sum{color:var(--primary);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.r-total .sum .rmb{font-size:13px}
.r-hint{margin-top:8px;text-align:center;font-size:11px;color:var(--warn)}
.cart-empty{text-align:center;color:var(--muted);padding:30px 0}
.cart-empty .big{font-size:36px}

/* ---------- 大图查看 ---------- */
#viewer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:14px}
#viewer img{width:100%;max-height:100%;object-fit:contain}
#viewer .tip{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:rgba(255,255,255,.75);font-size:12px}
#viewer .nav{position:fixed;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;
  background:rgba(0,0,0,.45);color:#fff;font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2}
#vPrev{left:10px}
#vNext{right:10px}
#vCount{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:3px 12px;font-size:12px}
#viewer .nav[hidden],#vCount[hidden]{display:none}
#viewer[hidden]{display:none}
.overlay[hidden]{display:none}

/* 预览退出条 */
#exitPreviewBar{position:fixed;top:0;left:0;right:0;z-index:50;background:#1f2329;color:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));font-size:13px;
  box-shadow:0 2px 10px rgba(0,0,0,.3)}
#exitPreviewBar[hidden]{display:none}
#exitPreviewBar button{flex:none;background:var(--grad);color:#fff;border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600}

/* ---------- 管理端 ---------- */
#admin{background:#f0f1f5;min-height:100vh;padding:0 0 60px}
.admin-wrap{max-width:900px;margin:0 auto;padding:0 16px}
.admin-top{background:#fff;border-bottom:1px solid var(--line);margin:0 -16px 16px;padding:16px}
.admin-top h1{margin:0 0 4px;font-size:20px}
.admin-top .sub{font-size:12px;color:var(--muted)}
.admin-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.a-btn{border:1px solid var(--primary);color:var(--primary);border-radius:8px;padding:8px 14px;font-size:13px;background:#fff}
.a-btn.solid{background:var(--grad);border:0;color:#fff;font-weight:600}
.a-btn.plain{border-color:var(--line);color:var(--text)}
fieldset{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 14px;border:none;box-shadow:0 1px 4px rgba(31,35,41,.05)}
legend{font-weight:700;padding:0 6px}
.frow{display:flex;gap:10px;flex-wrap:wrap}
.frow .fitem{flex:1;min-width:160px}
.fitem{margin-bottom:10px}
.fitem label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.fitem input[type=text],.fitem input[type=number],.fitem textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:0;background:#fff}
.fitem textarea{resize:vertical;min-height:44px}
.ptable-wrap{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(31,35,41,.05);overflow-x:auto}
table.ptable{width:100%;border-collapse:collapse;min-width:720px}
.ptable th,.ptable td{padding:9px 10px;text-align:left;border-bottom:1px solid #f2f3f5;font-size:13px;vertical-align:middle}
.ptable th{color:var(--muted);font-weight:500;background:#fafbfc;white-space:nowrap}
.ptable td.name-cell{max-width:320px}
.ptable td .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.ptable img.tn{width:40px;height:40px;border-radius:6px;object-fit:cover}
.ptable .tn-empty{width:40px;height:40px;border-radius:6px;background:#f2f3f5;display:flex;align-items:center;justify-content:center;font-size:16px}
.ptable .op{white-space:nowrap}
.ptable .op button{color:var(--primary);font-size:12px;padding:3px 6px}
.ptable .op button.mv{color:var(--muted)}
.ptable .op button.del{color:#c9cdd4}
.admin-tip{font-size:12px;color:var(--muted);line-height:1.8;margin:14px 0}

/* 商品表单弹层 */
#formWrap{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 14px}
#formWrap[hidden]{display:none}
.form-card{background:#fff;border-radius:14px;width:100%;max-width:560px;padding:18px 18px 14px}
.form-card h3{margin:0 0 14px;font-size:17px}
.img-pick{display:flex;align-items:center;gap:12px}
.img-pick .pv{width:84px;height:84px;border-radius:10px;border:1px dashed #d4d7dc;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fafbfc;color:#b3b7bf;font-size:22px;flex:none}
.img-pick .pv img{width:100%;height:100%;object-fit:cover}
.img-pick .ops{display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}
.filebtn{display:inline-block;border:1px solid var(--primary);color:var(--primary);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
input[type=file]{display:none}
.form-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.form-foot .a-btn{padding:9px 22px}
.err{color:var(--primary);font-size:12px;min-height:18px;margin-top:4px}

/* toast */
#toast{position:fixed;top:20%;left:50%;transform:translateX(-50%);z-index:99;background:rgba(0,0,0,.75);color:#fff;
  border-radius:8px;padding:10px 18px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.show{opacity:1}

@media (min-width:700px){
  .topbar{padding-left:0;padding-right:0}
  .topbar .inner,.filter-bar .inner{max-width:640px;margin:0 auto}
  #goods{max-width:640px;margin:0 auto}
  .filter-bar{padding-left:0;padding-right:0}
}
</style>
</head>
<body>

<!-- ================= 顾客视图 ================= -->
<div id="shop">
  <div class="topbar">
    <div class="inner">
      <h1 id="shopName">福利小卖部</h1>
      <div class="notice" id="notice"></div>
    </div>
  </div>

  <div class="filter-bar">
    <div class="inner">
      <div class="search-row" id="searchRow">
        <span class="icon">🔍</span>
        <input id="searchInput" type="search" placeholder="搜索商品…">
        <button class="clear" id="searchClear">✕</button>
      </div>
      <div class="chips dyn" id="chips"></div>
    </div>
  </div>

  <div id="goods" class="dyn"></div>

  <div id="cartBar" hidden>
    <div class="cart-ico">🛒<span class="badge dyn" id="badge"></span></div>
    <div class="cart-info">
      <span class="cart-cnt" id="cartCnt">未选商品</span>
      <span class="cart-total">合计 <span class="rmb">¥</span><span class="dyn" id="cartTotal">0</span></span>
    </div>
    <button class="btn-primary" id="openCart">查看购物车</button>
  </div>

  <div id="cartWrap" class="overlay" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <b>购物车</b><span class="cnt dyn" id="sheetCnt"></span>
        <button class="x" id="cartClose">✕</button>
      </div>
      <div class="sheet-body">
        <div id="receiptWrap" class="dyn"></div>
        <div class="sheet-actions" id="sheetActions"><button class="btn-ghost" id="clearCart">清空购物车</button></div>
      </div>
    </div>
  </div>

  <div id="viewer" hidden>
    <img id="viewerImg" alt="">
    <button id="vPrev" hidden>‹</button>
    <button id="vNext" hidden>›</button>
    <div id="vCount" hidden></div>
    <div class="tip">点击任意处关闭</div>
  </div>
</div>

<!-- ================= 管理端（#admin 进入） ================= -->
<div id="admin" hidden>
  <div class="admin-top">
    <div class="admin-wrap">
      <h1>🛠 商品管理台</h1>
      <div class="sub">编辑完成后点击「生成发布文件」，把下载的 HTML 文件发到微信群即可上架（顾客看不到本页面）</div>
      <div class="admin-actions">
        <button class="a-btn solid" id="btnAdd">＋ 新增商品</button>
        <button class="a-btn solid" id="btnGen">📦 生成发布文件</button>
        <button class="a-btn" id="btnPreview">👁 预览发布效果</button>
        <button class="a-btn plain" id="btnExport">导出数据备份</button>
        <button class="a-btn plain" id="btnImport">导入数据</button>
        <button class="a-btn plain" id="btnExit">返回商店预览</button>
      </div>
    </div>
  </div>

  <div class="admin-wrap">
    <fieldset>
      <legend>店铺信息</legend>
      <div class="frow">
        <div class="fitem"><label>店名</label><input type="text" id="inpShopName" placeholder="例如：福利小卖部"></div>
        <div class="fitem"><label>公告 / 购买提示</label><input type="text" id="inpNotice" placeholder="例如：截屏购物车汇总发群里即可下单"></div>
      </div>
      <div class="fitem" style="margin-bottom:0"><label>当前数据体积：<b id="dataSize">-</b>（建议整体不超过 20MB，图片会自动压缩）</label></div>
    </fieldset>

    <fieldset>
      <legend>商品列表（<span id="pcount">0</span> 件）</legend>
      <div class="ptable-wrap">
        <table class="ptable">
          <thead><tr>
            <th style="width:56px">图片</th><th>品名</th><th>分类</th><th>价格</th><th>库存</th><th>备注</th><th class="op">操作</th>
          </tr></thead>
          <tbody id="prows" class="dyn"></tbody>
        </table>
      </div>
      <p class="admin-tip">
        · 「↑ ↓」调整商品展示顺序；改完记得点顶部「生成发布文件」。<br>
        · 价格按「组」填：如 10 元 3 份 → 价格填 10、每组合计 3 份，商店会自动显示约 ¥3.33/份。<br>
        · 库存留空表示不限量；填 0 会显示「已售完」。<br>
        · 图片上传时自动压缩到宽 800px 以内，无需手动缩图。
      </p>
    </fieldset>
  </div>

  <!-- 商品编辑表单 -->
  <div id="formWrap" hidden>
    <div class="form-card">
      <h3 id="formTitle">新增商品</h3>
      <div class="fitem"><label>商品图片（自动压缩）</label>
        <div class="img-pick">
          <div class="pv" id="pvBox">🛒</div>
          <div class="ops">
            <label class="filebtn">选择图片<input type="file" id="inpImg" accept="image/*"></label>
            <button class="a-btn plain" id="btnRmImg" style="display:none">移除图片</button>
            <span id="imgInfo"></span>
          </div>
        </div>
      </div>
      <div class="fitem"><label>品名 *</label><input type="text" id="inpName" placeholder="商品名称"></div>
      <div class="frow">
        <div class="fitem"><label>分类</label><input type="text" id="inpCat" list="catList" placeholder="零食 / 日化 / 生活用品…">
          <datalist id="catList"></datalist></div>
        <div class="fitem"><label>价格（元 / 组）*</label><input type="number" id="inpPrice" min="0" step="0.01" placeholder="如 10"></div>
        <div class="fitem"><label>每组合计几份</label><input type="number" id="inpPer" min="1" step="1" value="1" placeholder="默认 1"></div>
      </div>
      <div class="frow">
        <div class="fitem"><label>库存（留空 = 不限）</label><input type="number" id="inpStock" min="0" step="1" placeholder="不限"></div>
        <div class="fitem"><label>备注（规格 / 口味 / 说明）</label><input type="text" id="inpNote" placeholder="如 110g×1袋"></div>
      </div>
      <div class="err" id="formErr"></div>
      <div class="form-foot">
        <button class="a-btn plain" id="formCancel">取消</button>
        <button class="a-btn solid" id="formSave">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- 预览退出条（仅管理台预览时显示） -->
<div id="exitPreviewBar" hidden>
  <span>👁 顾客视图预览中（当前编辑数据）</span>
  <button id="exitPreviewBtn">⏹ 退出预览</button>
</div>

function $(sel, root) { return (root || document).querySelector(sel); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function round2(n) { return Math.round((+n + Number.EPSILON) * 100) / 100; }
function fmtMoney(n) { var v = round2(n); return v % 1 === 0 ? String(v) : v.toFixed(2); }
function uid() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function nowStr() {
  var d = new Date(), p = function (n) { return n < 10 ? '0' + n : '' + n; };

}
function safeGet(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } }

function download(name, content, mime) {
  var blob = new Blob([content], { type: mime || 'text/html;charset=utf-8' });

}

var ADMIN_KEY = 'weishop_admin_v1';
var CART_KEY = 'weishop_cart_v1';
var isAdmin = /(#|^)admin/.test(location.hash);

function readEmbedded() {
  var el = document.getElementById('shop-data');
  try { return JSON.parse(el.textContent || '{}'); } catch (e) { return {}; }
}
function loadAdminData() {
  var s = safeGet(ADMIN_KEY);
  var stored = null;
  if (s) { try { var d = JSON.parse(s); if (d && d.products) stored = d; } catch (e) {} }
  var emb = readEmbedded();
  if (!stored) return emb;
  // 合并：以本地编辑为准；文件里新增商品/图片自动带入
  var byId = {}, byName = {};
  stored.products.forEach(function (p) { byId[p.id] = p; byName[p.name] = p; });
  var fileRev = emb.imgRev || 1, localRev = stored.imgRev || 1;
  var imgTakeOver = fileRev > localRev; // 文件批量换过图 → 用文件图覆盖本地旧内嵌图
  emb.products.forEach(function (ep) {
    var local = byId[ep.id] || byName[ep.name];
    if (!local) {
      stored.products.push(ep); byId[ep.id] = ep; byName[ep.name] = ep;
    } else if (ep.img && (!local.img || (imgTakeOver && String(local.img).slice(0, 4) === 'data'))) {
      local.img = ep.img;
    }
  });
  if (imgTakeOver) stored.imgRev = fileRev;
  return stored;
}
var DATA = isAdmin ? loadAdminData() : readEmbedded();
if (!DATA.products) DATA.products = [];
if (!DATA.shopName) DATA.shopName = '福利小卖部';

function derivePriceText(p) {
  return p.per > 1 ? fmtMoney(p.price) + '元' + p.per + '份' : fmtMoney(p.price) + '元';
}
function normalize(p, i) {
  p.id = p.id || ('seed-' + (i + 1));
  p.name = String(p.name || '');
  p.cat = String(p.cat || '');
  p.note = String(p.note || '');
  p.price = +p.price || 0;
  p.per = Math.max(1, parseInt(p.per, 10) || 1);
  p.stock = (p.stock === '' || p.stock == null) ? null : Math.max(0, parseInt(p.stock, 10) || 0);
  p.img = p.img || '';
  if (!p.priceText) p.priceText = derivePriceText(p);
  return p;
}
DATA.products = DATA.products.map(normalize);

function unitPrice(p) { return p.per > 1 ? round2(p.price / p.per) : round2(p.price); }
function byId(id) {
  for (var i = 0; i < DATA.products.length; i++) if (DATA.products[i].id === id) return DATA.products[i];
  return null;
}

/* ================= 购物车 ================= */
var cart = {}; // id -> qty（内存为准，localStorage 仅作恢复尝试）
(function restoreCart() {
  if (isAdmin) return;
  var s = safeGet(CART_KEY);
  if (!s) return;
  try {
    var o = JSON.parse(s), n = 0;
    for (var k in o) if (byId(k)) { cart[k] = o[k]; n++; }
  } catch (e) {}
})();
function saveCart() {
  if (isAdmin) return;
  safeSet(CART_KEY, JSON.stringify(cart));
}
function cartTotals() {
  var units = 0, sum = 0, lines = [];
  for (var id in cart) {
    var p = byId(id); if (!p || !cart[id]) continue;
    var u = unitPrice(p), q = cart[id], amt = round2(u * q);
    units += q; sum += amt;
    lines.push({ p: p, qty: q, unit: u, amt: amt });
  }
  return { units: units, total: round2(sum), lines: lines };
}

/* ================= 顾客视图 ================= */
var filter = { cat: '', q: '' };

function cats() {
  var seen = {}, out = [];
  DATA.products.forEach(function (p) {
    if (p.cat && !seen[p.cat]) { seen[p.cat] = 1; out.push(p.cat); }
  });
  return out;
}

function renderChips() {
  var html = '<button class="chip' + (filter.cat === '' ? ' on' : '') + '" data-cat="">全部</button>';
  cats().forEach(function (c) {
    html += '<button class="chip' + (filter.cat === c ? ' on' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
  });
  $('#chips').innerHTML = html;
}

function thumbHtml(p, cls) {
  return p.img
    ? '<img class="' + cls + '" src="' + p.img + '" alt="">'
    : '<div class="' + cls + ' noimg"><span>🛒</span></div>';
}

function stepperHtml(p, qty) {
  var soldOut = p.stock != null && p.stock <= 0;
  if (soldOut) return '';
  var atCap = p.stock != null && qty >= p.stock;
  var html = '<div class="stepper">';
  if (qty > 0) html += '<button class="st-btn dec" data-id="' + p.id + '" data-act="dec">−</button>' +
                       '<span class="st-num">' + qty + '</span>';
  html += '<button class="st-btn inc' + (atCap ? ' dis' : '') + '" data-id="' + p.id + '" data-act="inc">＋</button></div>';
  return html;
}

function cardHtml(p) {
  var qty = cart[p.id] || 0;
  var soldOut = p.stock != null && p.stock <= 0;
  var u = unitPrice(p);
  var stockChip = '';
  if (p.stock != null) stockChip = soldOut
    ? '<span class="chip-stock out">已售完</span>'
    : '<span class="chip-stock">剩' + p.stock + '件</span>';
  var perLine = p.per > 1
    ? '<span class="per">' + esc(p.priceText) + ' · 约¥' + fmtMoney(u) + '/份</span>'
    : (p.priceText !== derivePriceText(p) ? '<span class="per">' + esc(p.priceText) + '</span>' : '');
  return '<div class="card' + (soldOut ? ' soldout' : '') + '">' +
    '<div class="thumb" data-act="img" data-id="' + p.id + '">' + thumbHtml(p, '') + '</div>' +
    '<div class="info">' +
      '<div class="name">' + esc(p.name) + '</div>' +
      (p.note ? '<div class="note">' + esc(p.note) + '</div>' : '') +
      '<div class="pricerow"><div class="pricebox">' +
        '<span class="price"><span class="rmb">¥</span>' + fmtMoney(u) + '</span>' + perLine + stockChip +
      '</div>' + stepperHtml(p, qty) + '</div>' +
    '</div></div>';
}

function renderGoods() {
  var q = filter.q.toLowerCase();
  var list = DATA.products.filter(function (p) {
    if (filter.cat && p.cat !== filter.cat) return false;
    if (q && (p.name + ' ' + p.note + ' ' + p.cat).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  $('#goods').innerHTML = list.length
    ? list.map(cardHtml).join('')
    : '<div class="empty-tip"><div class="big">🧺</div>没有找到相关商品</div>';
}

function renderCart() {
  var t = cartTotals();
  var bar = $('#cartBar');
  if (t.units > 0) {
    bar.hidden = false;
    $('#badge').textContent = t.units > 99 ? '99+' : t.units;
    $('#cartCnt').textContent = '已选 ' + t.units + ' 件商品';
    $('#cartTotal').textContent = fmtMoney(t.total);
  } else {
    bar.hidden = true;
    $('#badge').textContent = '';
  }
  renderSheet(t);
}

function receiptHtml(t) {
  var lines = t.lines.map(function (l) {
    return '<div class="r-line">' +
      (l.p.img ? '<img src="' + l.p.img + '" alt="">' : '<div class="r-noimg">🛒</div>') +
      '<span class="r-name">' + esc(l.p.name) + '</span>' +
      stepperHtml(l.p, l.qty) +
      '<span class="r-amt">¥' + fmtMoney(l.amt) + '</span></div>';
  }).join('');
  return '<div class="receipt">' +
    '<div class="r-title"><b>' + esc(DATA.shopName) + ' · 订单汇总</b><time>' + nowStr() + '</time></div>' +
    lines +
    '<div class="r-total"><span class="t">共 ' + t.units + ' 件</span>' +
    '<span class="sum"><span class="rmb">合计 ¥</span>' + fmtMoney(t.total) + '</span></div>' +
    '<div class="r-hint">👇 截屏本卡片，发到群里即可下单</div>' +
    '</div>';
}

function renderSheet(t) {
  var rw = $('#receiptWrap');
  if (!t.lines.length) {
    rw.innerHTML = '<div class="cart-empty"><div class="big">🛒</div>购物车还是空的</div>';
    $('#sheetCnt').textContent = '';
    $('#sheetActions').hidden = true;
    return;
  }
  $('#sheetCnt').textContent = '（' + t.units + ' 件 · ¥' + fmtMoney(t.total) + '）';
  $('#sheetActions').hidden = false;
  rw.innerHTML = receiptHtml(t);
}

function changeQty(id, d) {
  var p = byId(id); if (!p) return;
  var q = cart[id] || 0;
  var nq = q + d;
  if (nq < 0) nq = 0;
  if (p.stock != null && nq > p.stock) { toast('库存仅剩 ' + p.stock + ' 件'); nq = p.stock; }
  if (nq === q) return;
  if (nq > 0) cart[id] = nq; else delete cart[id];
  saveCart(); renderGoods(); renderCart();
}

var vList = [], vIdx = 0;
function openViewer(p) {
  var list = (p.imgs && p.imgs.length) ? p.imgs : (p.img ? [p.img] : []);
  if (!list.length) { toast('该商品暂无图片'); return; }
  vList = list; vIdx = 0;
  showVImg();
  $('#viewer').hidden = false;
  document.body.classList.add('lock');
}
function showVImg() {
  $('#viewerImg').src = vList[vIdx];
  var multi = vList.length > 1;
  $('#vPrev').hidden = !multi;
  $('#vNext').hidden = !multi;
  $('#vCount').hidden = !multi;
  if (multi) $('#vCount').textContent = (vIdx + 1) + ' / ' + vList.length;
}
function vStep(d) {
  if (!vList.length) return;
  vIdx = (vIdx + d + vList.length) % vList.length;
  showVImg();
}
function closeViewer() {
  $('#viewer').hidden = true;
  document.body.classList.remove('lock');
}

function initShopEvents() {
  $('#goods').addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');

  });
  $('#chips').addEventListener('click', function (e) {
    var el = e.target.closest('.chip'); if (!el) return;
    filter.cat = el.getAttribute('data-cat');

  });
  $('#searchInput').addEventListener('input', function () {
    filter.q = this.value.trim();

  });
  $('#searchClear').addEventListener('click', function () {
    $('#searchInput').value = ''; filter.q = '';
    $('#searchRow').classList.remove('hasq'); renderGoods();

  $('#openCart').addEventListener('click', function () {

  $('#vPrev').addEventListener('click', function (e) { e.stopPropagation(); vStep(-1); });
  $('#vNext').addEventListener('click', function (e) { e.stopPropagation(); vStep(1); });

function closeCart() {
  $('#cartWrap').hidden = true; document.body.classList.remove('lock');
}

function compressImage(file, maxW, quality) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        try {
          var scale = Math.min(1, maxW / img.width);
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          var ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff';           // PNG 透明底转白
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(cv.toDataURL('image/jpeg', quality));
        } catch (e) { reject(e); }
      };
      img.onerror = function () { reject(new Error('图片无法读取')); };
      img.src = reader.result;
    };
    reader.onerror = function () { reject(new Error('图片读取失败')); };
    reader.readAsDataURL(file);
  });
}

function openForm(p) {
  editingId = p ? p.id : null;
  pendingImg = undefined;
  $('#formTitle').textContent = p ? '编辑商品' : '新增商品';
  $('#inpName').value = p ? p.name : '';
  $('#inpCat').value = p ? p.cat : '';
  $('#inpPrice').value = p ? p.price : '';
  $('#inpPer').value = p ? p.per : 1;
  $('#inpStock').value = p && p.stock != null ? p.stock : '';
  $('#inpNote').value = p ? p.note : '';
  $('#formErr').textContent = '';
  setFormImg(p ? p.img : '');
  $('#formWrap').hidden = false;
}
function setFormImg(dataUrl) {
  var box = $('#pvBox'), info = $('#imgInfo');
  if (dataUrl) {
    box.innerHTML = '<img src="' + dataUrl + '">';
    var kb = Math.round(dataUrl.length * 0.75 / 1024);
    info.textContent = kb + ' KB';
  } else {
    box.textContent = '🛒';
    info.textContent = pendingImg === '' ? '已移除' : '未设置';
  }
  $('#btnRmImg').style.display = (pendingImg === undefined ? (box.querySelector('img') ? '' : 'none') : (pendingImg ? '' : 'none'));
}
function closeForm() { $('#formWrap').hidden = true; }

function initAdminEvents() {
  $('#btnAdd').addEventListener('click', function () { openForm(null); });
  $('#prows').addEventListener('click', function (e) {
    var el = e.target.closest('[data-op]'); if (!el) return;
    var op = el.getAttribute('data-op'), i = +el.getAttribute('data-i');
    var arr = DATA.products;
    if (op === 'up' && i > 0) { var t = arr[i]; arr[i] = arr[i - 1]; arr[i - 1] = t; renderAdmin(); }
    else if (op === 'down' && i < arr.length - 1) { var t2 = arr[i]; arr[i] = arr[i + 1]; arr[i + 1] = t2; renderAdmin(); }
    else if (op === 'edit') openForm(arr[i]);
    else if (op === 'del') {
      if (confirm('确定删除「' + arr[i].name + '」？')) { arr.splice(i, 1); renderAdmin(); }
    }
  });
  $('#inpShopName').addEventListener('input', function () { DATA.shopName = this.value; saveAdmin(); });
  $('#inpNotice').addEventListener('input', function () { DATA.notice = this.value; saveAdmin(); });

  $('#inpImg').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type)) { toast('请选择图片文件'); return; }
    compressImage(f, 800, 0.8).then(function (dataUrl) {
      pendingImg = dataUrl; setFormImg(dataUrl);
    }, function () { toast('图片处理失败，请换一张试试'); });
    this.value = '';
  });
  $('#btnRmImg').addEventListener('click', function () {
    pendingImg = editingId ? '' : ''; setFormImg('');
  });
  $('#formCancel').addEventListener('click', closeForm);
  $('#formWrap').addEventListener('click', function (e) { if (e.target === this) closeForm(); });
  $('#formSave').addEventListener('click', function () {
    var name = $('#inpName').value.trim();
    var price = parseFloat($('#inpPrice').value);
    if (!name) { $('#formErr').textContent = '请填写品名'; return; }
    if (!(price >= 0) || isNaN(price)) { $('#formErr').textContent = '请填写正确的价格'; return; }
    var per = Math.max(1, parseInt($('#inpPer').value, 10) || 1);
    var stockStr = $('#inpStock').value.trim();
    var p;
    if (editingId) {
      p = byId(editingId);
    } else {
      p = { id: uid() }; DATA.products.push(p);
    }
    p.name = name;
    p.cat = $('#inpCat').value.trim();
    p.note = $('#inpNote').value.trim();
    p.price = round2(price);
    p.per = per;
    p.stock = stockStr === '' ? null : Math.max(0, parseInt(stockStr, 10) || 0);
    if (pendingImg !== undefined) p.img = pendingImg;
    p.priceText = derivePriceText(p);
    closeForm(); renderAdmin();
    toast('已保存：' + name);
  });

  $('#btnGen').addEventListener('click', function () {
    if (!DATA.products.length) { toast('还没有商品，先新增或导入'); return; }
    if (isWeixin()) {
      toast('微信内不能下载文件，已为你打开预览；正式发布请在电脑上操作');
      enterPreview();
      return;
    }
    var html = buildPublishHTML();
    download('index.html', html);
    toast('已生成 index.html：拖进 deploy.zip 替换同名文件后部署，或与 images 文件夹一起拖入 EdgeOne');
  });
  $('#btnPreview').addEventListener('click', enterPreview);
  $('#btnExport').addEventListener('click', function () {
    if (isWeixin()) { toast('微信内不能下载文件，请点右上角 ··· 在浏览器中打开后操作'); return; }
    download('weishop-backup-' + Date.now() + '.json', JSON.stringify(DATA), 'application/json;charset=utf-8');
  });
  $('#btnImport').addEventListener('click', function () {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var d = JSON.parse(r.result);
          if (!d || !d.products) throw 0;
          if (!confirm('导入会覆盖当前全部数据（' + d.products.length + ' 件商品），确定？')) return;
          DATA = { shopName: d.shopName || DATA.shopName, notice: d.notice || '', products: d.products.map(normalize) };
          renderAdmin();
          toast('导入成功');
        } catch (e) { toast('文件格式不正确'); }
      };
      r.readAsText(f, 'utf-8');
    };
    inp.click();
  });
  $('#btnExit').addEventListener('click', function () { location.hash = ''; location.reload(); });
}

/* ================= 生成发布文件 ================= */
function buildPublishHTML() {
  var json = JSON.stringify({
    shopName: DATA.shopName,
    notice: DATA.notice || '',
    products: DATA.products
  }).replace(/<\/script/gi, '<\\/script');

  var clone = document.documentElement.cloneNode(true);

  // 清空所有动态渲染容器与运行态样式，得到干净模板
  var empty = clone.querySelectorAll('.dyn');
  for (var i = 0; i < empty.length; i++) empty[i].innerHTML = '';
  ['cartBar', 'cartWrap', 'viewer', 'formWrap', 'exitPreviewBar'].forEach(function (id) {
    var el = clone.querySelector('#' + id); if (el) el.setAttribute('hidden', '');
  });
  var shop = clone.querySelector('#shop'); if (shop) shop.removeAttribute('hidden');
  var adm = clone.querySelector('#admin'); if (adm) adm.setAttribute('hidden', '');
  var body = clone.querySelector('body'); if (body) body.setAttribute('class', '');
  var search = clone.querySelector('#searchInput'); if (search) search.setAttribute('value', '');
  var searchRow = clone.querySelector('#searchRow'); if (searchRow) searchRow.setAttribute('class', 'search-row');
  var title = clone.querySelector('title'); if (title) title.textContent = DATA.shopName || '福利小卖部';
  var leftovers = clone.querySelectorAll('#pvBox, #imgInfo, #formErr, #catList, #toast, #wxWarn, #vCount');
  for (var j = 0; j < leftovers.length; j++) leftovers[j].innerHTML = '';
  var vimgEl = clone.querySelector('#viewerImg'); if (vimgEl) vimgEl.removeAttribute('src');
  var toastEl = clone.querySelector('#toast'); if (toastEl) toastEl.removeAttribute('class');
  var ds = clone.querySelector('#shop-data');
  if (ds) ds.textContent = json;

  return '<!DOCTYPE html>\n' + clone.outerHTML;
}

/* ================= 启动 ================= */
function initShop() {
  $('#shopName').textContent = DATA.shopName;
  document.title = DATA.shopName;
  $('#notice').textContent = DATA.notice || '';
  renderChips(); renderGoods(); renderCart();
}
function initAdmin() {
  $('#shop').hidden = true;
  $('#admin').hidden = false;
  if (isWeixin() && !$('#wxWarn')) {
    var w = document.createElement('div');
    w.id = 'wxWarn';
    w.style.cssText = 'margin-top:10px;background:#fdf3e3;border:1px solid #e6a23c;border-radius:8px;padding:8px 12px;font-size:12px;color:#8a6116;line-height:1.6';
    w.textContent = '⚠ 当前在微信内打开：可正常浏览和编辑，但「生成发布文件 / 导出备份」不能下载。请点右上角 ··· → 在浏览器打开，或在电脑上操作。';
    $('.admin-actions').parentNode.insertBefore(w, $('.admin-actions'));
  }
  renderAdmin();
  initAdminEvents();
}
initShopEvents();
$('#exitPreviewBtn').addEventListener('click', exitPreview);
if (isAdmin) initAdmin(); else initShop();

// 测试钩子：只读，不影响顾客使用
window.__weishop = {
  build: buildPublishHTML,
  data: function () { return JSON.parse(JSON.stringify(DATA)); }
};

})();
</script>
